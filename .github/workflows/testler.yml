name: testler

# Testler elle koşulduğu sürece kırıldıklarını ancak biri koşturunca
# öğreniyoruz. Her itmede ve her PR'da koşuyorlar.
on:
  push:
    branches: [main, "**"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Sistem paketleri
        # PyQt5 başsız koşarken de X kütüphanelerini bağlıyor; offscreen
        # platformu bunlar olmadan yüklenmiyor.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1 libgl1 libxkbcommon-x11-0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xfixes0

      - name: Python paketleri
        # ultralytics ve torch kurulmuyor: testler sahte yığınla koşuyor ve
        # gerçek modeller CI'da dakikalar sürerdi.
        run: pip install --quiet PyQt5 numpy opencv-python-headless PyYAML

      - name: Testler
        env:
          QT_QPA_PLATFORM: offscreen
        run: ./testler/calistir.sh hizli
